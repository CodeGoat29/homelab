services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    environment:
      TZ: America/New_York
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - type: bind
        source: /srv/media
        target: /media
        read_only: true
        bind:
          create_host_path: false

volumes:
  jellyfin_config:
  jellyfin_cache:
