services:
  fail2ban:
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - VERBOSITY=-vv
    volumes:
      - /opt/fail2ban:/config
      - /var/log:/var/log:ro
      - /path/to/nginx-proxy-manager/logs:/remotelogs/nginx:ro
    restart: unless-stopped